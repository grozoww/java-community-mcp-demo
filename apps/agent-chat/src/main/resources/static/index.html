<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>MCP Agent — Java Community</title>
<style>
  :root {
    --bg: #0e1116;
    --panel: #161b22;
    --panel-2: #1c2230;
    --line: #272e3b;
    --text: #e6edf3;
    --muted: #8b97a8;
    --accent: #4f9cf9;
    --accent-2: #7ee787;
    --warn: #f0b429;
    --danger: #f85149;
    --mono: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 20px; padding: 14px 22px;
    border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; letter-spacing: -0.01em; }
  header h1 span { color: var(--muted); font-weight: 400; }
  .modes { display: flex; gap: 4px; background: var(--panel-2); padding: 4px; border-radius: 10px; }
  .modes button {
    background: transparent; border: 0; color: var(--muted); padding: 7px 14px;
    border-radius: 7px; cursor: pointer; font-size: 14px; font-weight: 500;
  }
  .modes button.active { background: var(--accent); color: #06121f; }
  .badge {
    margin-left: auto; font: 13px/1 var(--mono); color: var(--muted);
    background: var(--panel-2); border: 1px solid var(--line); padding: 8px 12px; border-radius: 8px;
  }
  .badge b { color: var(--accent-2); }
  main { flex: 1; display: grid; grid-template-columns: 1fr 400px; min-height: 0; }
  #chat { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); }
  #log { flex: 1; overflow-y: auto; padding: 22px 26px; }
  .msg { max-width: 780px; margin: 0 0 18px; }
  .msg .who { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 6px; }
  .msg.user .bubble { background: var(--panel-2); }
  .bubble { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; white-space: pre-wrap; }
  .bubble code { font-family: var(--mono); font-size: 14px; background: #0b0f15; padding: 1px 5px; border-radius: 4px; }
  .meta { font: 12px/1 var(--mono); color: var(--muted); margin-top: 8px; }
  form { display: flex; gap: 10px; padding: 16px 26px; border-top: 1px solid var(--line); background: var(--panel); }
  input[type=text] {
    flex: 1; background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    padding: 13px 15px; border-radius: 10px; font-size: 15px; outline: none;
  }
  input[type=text]:focus { border-color: var(--accent); }
  button.send { background: var(--accent); color: #06121f; border: 0; padding: 0 22px; border-radius: 10px; font-weight: 600; cursor: pointer; }
  button.send:disabled { opacity: .5; cursor: default; }
  aside { overflow-y: auto; padding: 18px 20px; background: var(--panel); }
  aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 0 0 10px; }
  aside section { margin-bottom: 26px; }
  .chip {
    display: inline-block; font-size: 13px; color: var(--text); background: var(--panel-2);
    border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; margin: 0 6px 6px 0; cursor: pointer;
  }
  .chip:hover { border-color: var(--accent); }
  .call { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; background: var(--panel-2); }
  .call .name { font: 13px/1.3 var(--mono); color: var(--accent); }
  .call .args, .call .res { font: 12px/1.45 var(--mono); color: var(--muted); white-space: pre-wrap; word-break: break-all; margin-top: 6px; max-height: 120px; overflow: hidden; }
  .call.error .name { color: var(--danger); }
  .call.approval_required .name { color: var(--warn); }
  .approval { border: 1px solid var(--warn); border-radius: 10px; padding: 12px; margin-bottom: 10px; background: #241c07; }
  .approval .t { font: 13px var(--mono); color: var(--warn); }
  .approval .a { font: 12px var(--mono); color: var(--muted); white-space: pre-wrap; word-break: break-all; margin: 8px 0; }
  .approval button { border: 0; border-radius: 7px; padding: 7px 14px; margin-right: 8px; cursor: pointer; font-weight: 600; }
  .approve { background: var(--accent-2); color: #06121f; }
  .reject { background: #30363d; color: var(--text); }
  .tool-row { font: 12px/1.5 var(--mono); color: var(--muted); display: flex; justify-content: space-between; gap: 10px; }
  .tool-row b { color: var(--text); font-weight: 500; }
  .dots::after { content: '.'; animation: dots 1.2s steps(4, end) infinite; }
  @keyframes dots { 0%{content:''} 25%{content:'.'} 50%{content:'..'} 75%{content:'...'} }
</style>
</head>
<body>
<header>
  <h1>MCP Agent <span>· Java Community demo</span></h1>
  <div class="modes" id="modes">
    <button data-mode="TOOLS" class="active">Tools</button>
    <button data-mode="CODE">Code mode</button>
    <button data-mode="PLAIN">No tools</button>
  </div>
  <div class="badge" id="cost">tool definitions: <b>—</b> tokens</div>
</header>

<main>
  <div id="chat">
    <div id="log"></div>
    <form id="form">
      <input id="input" type="text" autocomplete="off" placeholder="Ask the agent something about the repository…"/>
      <button class="send" id="send" type="submit">Send</button>
    </form>
  </div>

  <aside>
    <section>
      <h2>Try</h2>
      <div id="suggestions"></div>
    </section>
    <section id="approvals-section" style="display:none">
      <h2>Waiting for your approval</h2>
      <div id="approvals"></div>
    </section>
    <section>
      <h2>Tool calls this turn</h2>
      <div id="calls"><span class="tool-row">nothing yet</span></div>
    </section>
    <section>
      <h2>Connected MCP tools</h2>
      <div id="tools"></div>
    </section>
  </aside>
</main>

<script>
const conversationId = 'demo-' + Math.random().toString(36).slice(2, 8);
let mode = 'TOOLS';

const $ = (id) => document.getElementById(id);

document.querySelectorAll('#modes button').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('#modes button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    mode = btn.dataset.mode;
  };
});

function addMessage(who, text, meta) {
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + (who === 'You' ? 'user' : 'agent');
  wrap.innerHTML = `<div class="who">${who}</div><div class="bubble"></div>`;
  wrap.querySelector('.bubble').textContent = text;
  if (meta) {
    const m = document.createElement('div');
    m.className = 'meta';
    m.textContent = meta;
    wrap.appendChild(m);
  }
  $('log').appendChild(wrap);
  $('log').scrollTop = $('log').scrollHeight;
  return wrap;
}

function renderCalls(calls) {
  const box = $('calls');
  if (!calls || calls.length === 0) {
    box.innerHTML = '<span class="tool-row">no tool calls</span>';
    return;
  }
  box.innerHTML = calls.map(c => `
    <div class="call ${c.status}">
      <div class="name">${c.tool} · ${c.millis} ms · ${c.status}</div>
      <div class="args">${escapeHtml(c.arguments || '')}</div>
      <div class="res">${escapeHtml((c.result || '').slice(0, 400))}</div>
    </div>`).join('');
}

function renderApprovals(list) {
  const section = $('approvals-section');
  const box = $('approvals');
  if (!list || list.length === 0) { section.style.display = 'none'; box.innerHTML = ''; return; }
  section.style.display = 'block';
  box.innerHTML = list.map(a => `
    <div class="approval">
      <div class="t">${a.toolName}</div>
      <div class="a">${escapeHtml(a.arguments)}</div>
      <button class="approve" data-id="${a.id}">Approve</button>
      <button class="reject" data-id="${a.id}">Reject</button>
    </div>`).join('');
  box.querySelectorAll('.approve').forEach(b => b.onclick = () => decide(b.dataset.id, 'approve'));
  box.querySelectorAll('.reject').forEach(b => b.onclick = () => decide(b.dataset.id, 'reject'));
}

async function decide(id, what) {
  await fetch(`/api/approvals/${id}/${what}`, { method: 'POST' });
  renderApprovals([]);
  if (what === 'approve') {
    send('Approved. Go ahead and perform exactly the action you described.');
  } else {
    send('Rejected. Do not perform that action; suggest an alternative instead.');
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
}

async function send(text) {
  if (!text.trim()) return;
  addMessage('You', text);
  $('send').disabled = true;
  const thinking = addMessage('Agent', '');
  thinking.querySelector('.bubble').innerHTML = '<span class="dots">thinking</span>';

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ conversationId, message: text, mode })
    });
    const data = await res.json();
    thinking.querySelector('.bubble').textContent = data.reply;
    const t = data.tokens || {};
    thinking.querySelector('.meta')?.remove();
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = `${data.mode} · ${data.millis} ms · tool defs ~${t.toolDefinitionsInContext} tok`
      + (t.promptTokens != null ? ` · prompt ${t.promptTokens} · completion ${t.completionTokens}` : '');
    thinking.appendChild(meta);
    renderCalls(data.toolCalls);
    renderApprovals(data.approvals);
  } catch (e) {
    thinking.querySelector('.bubble').textContent = 'Request failed: ' + e;
  } finally {
    $('send').disabled = false;
    $('input').focus();
  }
}

$('form').onsubmit = (e) => { e.preventDefault(); const v = $('input').value; $('input').value = ''; send(v); };

fetch('/api/tools').then(r => r.json()).then(data => {
  $('cost').innerHTML = `${data.count} tools · <b>${data.contextCostTokens}</b> tokens of definitions`;
  $('tools').innerHTML = data.tools.map(t =>
    `<div class="tool-row"><b>${t.name}</b><span>${t.totalTokens} tok</span></div>`).join('');
  $('suggestions').innerHTML = (data.suggestions || [])
    .map(s => `<span class="chip">${escapeHtml(s)}</span>`).join('');
  document.querySelectorAll('.chip').forEach(c => c.onclick = () => send(c.textContent));
});
</script>
</body>
</html>
